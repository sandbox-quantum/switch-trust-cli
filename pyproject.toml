[project]
name = "switch-trust-cli"
version = "1.8.0"
description = "Command-line tool for evaluating agents, offering two features to assess agents via code scanning (`switch-trust scan`, whitebox testing) and runtime evaluation (`switch-trust eval`, blackbox testing)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "SandboxAQ", email = "info@switchagents.ai" },
]
# These versions are kept in step with the versions the library is developed
# and tested against upstream, so an installed `switch-trust` runs what was
# tested. Please raise an issue rather than re-pinning one in isolation.
dependencies = [
  "aiohttp>=3.14.3",
  "anthropic>=0.25.0",
  # Direct floor pin for transitive dependency of google-adk->google-auth
  # required for `pip-compile` to resolve the dependency tree.
  "pyOpenSSL>=26.4.0",
  # Direct floor pin for a transitive dependency to pull in the security fix
  # for PYSEC-2026-3552 (PKCS#7 Bleichenbacher oracle).
  "cryptography>=50.0.0",
  "bandit==1.9.4",
  "cvss>=2.6",
  "datafog==4.4.0",
  "dataclasses-json==0.6.7",
  "detect-secrets==1.5.0",
  "google-adk==1.38.0",
  # switch_trust/eval/core/models/{generator_model,
  # model_vertex_agent_runtime}.py build service-account credentials with it.
  "google-auth>=2.60.0",
  "google-genai>=1.0.0",
  # switch_trust/scan/exception_classification.py classifies httpx transport
  # errors.
  "httpx==0.28.1",
  "litellm==1.100.4",
  "openai>=1.0.0",
  "opentelemetry-api==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
  "opentelemetry-sdk==1.38.0",
  "pip-audit==2.10.1",
  # google-adk chains the whole otel stack to <=1.42.1, whose
  # opentelemetry-proto still requires protobuf<7.0, while google-api-core /
  # googleapis-common-protos / grpcio-status require protobuf>=6.33.5. The
  # exact pin keeps the resolver from backtracking down from protobuf 7.x.
  "protobuf==6.33.5",
  "pydantic==2.12.5",
  "python-dotenv>=1.0.0",
  # switch_trust/scan/static_scanner.py parses the OpenGrep rule file.
  "PyYAML>=6.0.0",
  "requests==2.34.2",
  "rich>=13.0.0",
]

[project.optional-dependencies]
# Heavy ML backends kept out of the core install. ``garak`` powers garak probes
# and detectors; ``transformers[torch]`` powers toxicity detection and the
# local evaluation of models retrieved from HuggingFace (torch alone is ~2 GB
# and also pulls in Cuda on Linux). Install with
# ``pip install switch-trust-cli[full]``.
full = [
  "garak==0.14.0",
  "transformers[torch]==5.10.1",
]

[dependency-groups]
dev = [
  "pip-licenses>=5.0",
  "cyclonedx-bom>=6.0",
  "pip-audit>=2.7",
  "pip-tools>=7.4",
  "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["switch_trust*"]

[tool.setuptools.package-data]
switch_trust = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.txt",
    "**/*.csv",
]

[project.scripts]
switch-trust = "switch_trust.cli.main:main"

# TODO(rebrand): these point at the intended new repo, which doesn't exist yet.
# Update once sandbox-quantum/switch-trust is created.
[project.urls]
Homepage = "https://github.com/sandbox-quantum/switch-trust-cli"
Issues = "https://github.com/sandbox-quantum/switch-trust-cli/issues"
